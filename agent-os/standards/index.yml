# Agent OS Standards Index

architecture:
  domain-modules:
    description: "Code lives in src/Domains/{Domain} modules (Access, Dashboard, Navigation, Plugins, Search, Settings, Widgets), each with its own provider registered by Domains\\DomainServiceProvider; models are {Entity}Model; moved models keep their old class name as a morph alias"
  actions-events:
    description: "Action execute()/handle() split; starting + finished ActionEvent pair per action; DB::transaction in perform(); finished events after commit; concrete return types; no model constructor DI"
  request-persist:
    description: "FormRequests own validation, policy authorization (allows/allowsEach) and work via abstract persist(); controllers collapse to return $request->persist(); actions do the writing, never controllers"

models:
  lifecycle-events:
    description: "DispatchesModelEvents trait maps every Eloquent hook to Domains\\{Domain}\\Events\\{Entity}{Hook}Event implementing ModelLifecycleEvent; lifecycle events for data concerns, ActionEvents for business logic"
